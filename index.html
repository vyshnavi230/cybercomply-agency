<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CyberComply | Autonomous GRC Operations Center</title>
  
  <!-- Premium Modern Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg: #07090e;
      --card-bg: rgba(17, 24, 39, 0.75);
      --card-border: rgba(56, 189, 248, 0.15);
      --accent: #38bdf8;
      --accent-gradient: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
      --text: #f8fafc;
      --muted: #94a3b8;
      --critical: #ff3366;
      --medium: #f59e0b;
      --success: #10b981;
      --purple: #a855f7;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    
    body {
      background: radial-gradient(circle at 50% 0%, #0d1a30 0%, #07090e 70%);
      color: var(--text);
      min-height: 100vh;
      padding: 2.5rem 1.5rem;
    }

    .container { max-width: 1240px; margin: 0 auto; }

    /* Header */
    header { text-align: center; margin-bottom: 2.5rem; }
    header h1 {
      font-size: 3rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      background: var(--accent-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.5rem;
    }
    header p { color: var(--muted); font-size: 1.1rem; max-width: 700px; margin: 0 auto; }
    
    .meta-tag {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      margin-top: 1rem;
      font-size: 0.85rem;
      font-weight: 600;
      background: rgba(56, 189, 248, 0.08);
      color: var(--accent);
      border: 1px solid rgba(56, 189, 248, 0.25);
      padding: 0.35rem 1rem;
      border-radius: 9999px;
      backdrop-filter: blur(8px);
    }

    /* Live Status Banner */
    .status-banner {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--card-border);
      padding: 0.85rem 1.5rem;
      border-radius: 12px;
      margin-bottom: 2rem;
      font-size: 0.9rem;
      backdrop-filter: blur(12px);
    }
    .pulse-dot {
      display: inline-block;
      width: 10px;
      height: 10px;
      background: var(--success);
      border-radius: 50%;
      box-shadow: 0 0 12px var(--success);
      margin-right: 8px;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
      70% { transform: scale(1); box-shadow: 0 0 0 8px rgba(16, 185, 129, 0); }
      100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
    }

    /* Stats Scorecards */
    .grid-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 1.25rem; margin-bottom: 2.5rem; }
    .stat-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 1.5rem;
      text-align: center;
      backdrop-filter: blur(12px);
      transition: transform 0.2s, border-color 0.2s;
    }
    .stat-card:hover { transform: translateY(-3px); border-color: var(--accent); }
    .stat-card h3 { font-size: 2.5rem; font-weight: 800; font-family: 'JetBrains Mono', monospace; margin-bottom: 0.25rem; }
    .stat-card span { color: var(--muted); font-size: 0.8rem; text-transform: uppercase; font-weight: 700; letter-spacing: 0.08em; }

    .section-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 1.2rem; }
    .section-title { font-size: 1.35rem; font-weight: 700; letter-spacing: -0.01em; color: #fff; }
    .section-subtitle { font-size: 0.85rem; color: var(--muted); }

    /* Interactive Agent Squad */
    .agent-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 1.2rem; margin-bottom: 2.5rem; }
    .agent-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 1.3rem;
      cursor: pointer;
      backdrop-filter: blur(12px);
      transition: all 0.25s ease;
      position: relative;
    }
    .agent-card:hover {
      border-color: var(--accent);
      transform: translateY(-2px);
      box-shadow: 0 8px 24px -6px rgba(0, 242, 254, 0.15);
    }
    .agent-card.active {
      border-color: #38bdf8;
      background: rgba(14, 165, 233, 0.08);
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.2);
    }
    .agent-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.4rem; }
    .agent-name { font-weight: 700; font-size: 1.1rem; color: #fff; }
    .agent-badge { font-size: 0.75rem; font-family: 'JetBrains Mono', monospace; font-weight: 600; padding: 0.2rem 0.6rem; border-radius: 6px; }
    .agent-role { font-size: 0.82rem; color: var(--accent); margin-bottom: 0.75rem; font-weight: 500; }
    .agent-task {
      font-size: 0.85rem;
      color: #cbd5e1;
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 8px;
      padding: 0.65rem 0.85rem;
      line-height: 1.4;
    }

    /* Telemetry Box */
    .terminal-box {
      background: #04060a;
      border: 1px solid rgba(56, 189, 248, 0.2);
      border-radius: 12px;
      padding: 1rem 1.25rem;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.85rem;
      color: #38bdf8;
      height: 120px;
      overflow-y: auto;
      margin-bottom: 2.5rem;
      box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.6);
    }
    .terminal-line { margin-bottom: 0.35rem; }
    .terminal-time { color: var(--muted); }

    /* Visual Analytics */
    .chart-section { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; margin-bottom: 2.5rem; }
    @media (max-width: 768px) { .chart-section { grid-template-columns: 1fr; } }
    .chart-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 1.5rem;
      backdrop-filter: blur(12px);
    }
    .chart-card h4 { font-size: 0.95rem; font-weight: 700; color: var(--muted); margin-bottom: 1.2rem; text-transform: uppercase; letter-spacing: 0.05em; }

    /* Controls Toolbar */
    .toolbar {
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 1.2rem;
      flex-wrap: wrap;
      align-items: center;
    }
    .filter-group { display: flex; gap: 0.6rem; flex-wrap: wrap; }
    .input-search, .select-filter {
      background: rgba(17, 24, 39, 0.85);
      border: 1px solid var(--card-border);
      color: #fff;
      padding: 0.6rem 0.9rem;
      border-radius: 8px;
      font-size: 0.85rem;
      outline: none;
      transition: border-color 0.2s;
    }
    .input-search:focus, .select-filter:focus { border-color: var(--accent); }
    .input-search { width: 240px; }

    /* Table */
    .table-container {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      overflow-x: auto;
      margin-bottom: 2.5rem;
      backdrop-filter: blur(12px);
    }
    table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.9rem; }
    th {
      background: rgba(15, 23, 42, 0.85);
      color: var(--muted);
      font-weight: 700;
      padding: 0.9rem 1.2rem;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      border-bottom: 1px solid var(--card-border);
    }
    td { padding: 1rem 1.2rem; border-bottom: 1px solid rgba(255, 255, 255, 0.05); }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: rgba(56, 189, 248, 0.02); }

    code { font-family: 'JetBrains Mono', monospace; font-weight: 600; color: var(--accent); font-size: 0.85rem; }

    /* Badges */
    .badge {
      display: inline-block;
      padding: 0.25rem 0.65rem;
      border-radius: 6px;
      font-weight: 700;
      font-size: 0.75rem;
      font-family: 'JetBrains Mono', monospace;
      letter-spacing: 0.03em;
    }
    .badge-critical { background: rgba(255, 51, 102, 0.15); color: var(--critical); border: 1px solid rgba(255, 51, 102, 0.3); }
    .badge-medium { background: rgba(245, 158, 11, 0.15); color: var(--medium); border: 1px solid rgba(245, 158, 11, 0.3); }
    .badge-low { background: rgba(16, 185, 129, 0.15); color: var(--success); border: 1px solid rgba(16, 185, 129, 0.3); }
